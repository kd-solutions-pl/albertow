# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-albertow"
BBFILE_PATTERN_meta-albertow = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-albertow = "9"

LAYERDEPENDS_meta-albertow = "core"
LAYERSERIES_COMPAT_meta-albertow = "wrynose"
